name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job names are the required status checks in the main ruleset; keep them in sync.
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/whatsapp/bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/whatsapp/bridge/go.mod
          cache-dependency-path: plugins/whatsapp/bridge/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o /dev/null .

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/whatsapp/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the digest tests build their fixture through the bridge's own writer
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/whatsapp/bridge/go.mod
          cache-dependency-path: plugins/whatsapp/bridge/go.sum
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --with pytest python -m pytest tests -q
      - name: MCP server starts and lists its tools
        run: |
          uv run python -c "import asyncio, main; names = sorted(t.name for t in asyncio.run(main.mcp.list_tools())); print(names); assert 'digest' in names and 'send_message' in names"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: manifests
        run: |
          jq -e '.name and (.plugins | length > 0)' .claude-plugin/marketplace.json
          jq -e '.name and .version and .description' plugins/whatsapp/.claude-plugin/plugin.json
          jq -e '.hooks.PreToolUse[0].matcher' plugins/whatsapp/hooks/hooks.json
          jq -e '.permissions.disableBypassPermissionsMode == "disable"' plugins/whatsapp/wa/settings.json
          test "$(jq -r .version plugins/whatsapp/.claude-plugin/plugin.json)" != null
      - name: shellcheck
        run: shellcheck plugins/whatsapp/bin/install.sh plugins/whatsapp/bin/wa plugins/whatsapp/hooks/*.sh
      - name: bypass guard
        run: plugins/whatsapp/hooks/test-bypass-guard.sh
